<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Bench Elevation: the ink stage plate with a He-Ne beam through a double slit.
       Paper rules it, ink holds it, red is the one accent. -->
  <rect width="64" height="64" rx="14" fill="#101214"/>

  <!-- Incident He-Ne beam -->
  <line x1="5" y1="32" x2="25" y2="32" stroke="#cf3b2e" stroke-width="3" stroke-linecap="round"/>

  <!-- Slit barrier: three paper segments leaving two openings -->
  <rect x="25" y="9" width="4" height="14" rx="1" fill="#f5f4f0"/>
  <rect x="25" y="30" width="4" height="4" rx="1" fill="#f5f4f0"/>
  <rect x="25" y="41" width="4" height="14" rx="1" fill="#f5f4f0"/>

  <!-- Emerging wavefronts from both slits -->
  <path d="M 29 26 C 37 28, 37 36, 29 38" fill="none" stroke="#cf3b2e" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
  <path d="M 29 38 C 37 36, 37 28, 29 26" fill="none" stroke="#cf3b2e" stroke-width="2" stroke-linecap="round" opacity="0.35"/>

  <!-- Interference fringes on the detector plane -->
  <line x1="54" y1="20" x2="54" y2="26" stroke="#cf3b2e" stroke-width="3" stroke-linecap="round"/>
  <line x1="54" y1="30" x2="54" y2="34" stroke="#cf3b2e" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="54" y1="38" x2="54" y2="44" stroke="#cf3b2e" stroke-width="3" stroke-linecap="round"/>
</svg>
